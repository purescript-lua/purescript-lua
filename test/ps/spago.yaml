# PureScript Lua compiler — golden test project.
#
# Builds against the published purescript-lua package set
# (workspace.packageSet.url): the set is the upstream registry baseline with the
# Lua forks overlaid (they ship .lua FFI and override their JavaScript-targeting
# upstreams). No inlined extraPackages — the set carries the fork versions and
# dependency lists centrally. spago.lock records the set URL, an inlined
# snapshot of it, and the resolved fork commits. purs stays at 0.15.16; the set
# is built with 0.15.15 (a proven-compatible pairing in this repo).
package:
  name: test-project
  dependencies:
    - arrays
    - console
    - effect
    - either
    - enums
    - foldable-traversable
    - maybe
    - newtype
    - partial
    - prelude
    - profunctor
    - strings
    - tailrec
    - transformers
    - tuples
workspace:
  # Spago >= 0.93 dropped `purs --codegen corefn` from `--purs-args` (it manages
  # codegen itself). The supported way to get CoreFn out is to declare a custom
  # backend: with a backend set, Spago compiles with `--codegen corefn` (not js)
  # and then runs the backend command. The golden harness only needs the
  # emitted `corefn.json`, so the backend is a no-op (`true`); this also
  # sidesteps the corefn-staleness bug (purescript/spago#643), which only bit
  # when switching between codegen targets.
  backend:
    cmd: "true"
  packageSet:
    url: https://github.com/purescript-lua/purescript-lua-package-sets/releases/download/psc-0.15.15-20260624/packages.json
